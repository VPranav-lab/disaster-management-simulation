    <script type="text/javascript">
document.addEventListener('DOMContentLoaded', function() { const svg = document.getElementById('simSvgImage'); const svgCanvas = document.getElementById('simCanvas'); let scale = 1; const scaleStep = 0.1; const panSpeed = 1; let panX = 0; let panY = 0; function updateTransform() { svg.style.transform = `matrix(${scale}, 0, 0, ${scale}, ${panX}, ${panY})`; } function fitAll() { const svgRect = svg.getBBox(); const containerRect = svg.parentNode.getBoundingClientRect(); const scaleX = containerRect.width / svgRect.width; const scaleY = containerRect.height / svgRect.height; scale = Math.min(scaleX, scaleY); panX = (containerRect.width - svgRect.width * scale) / 2 - svgRect.x * scale; panY = (containerRect.height - svgRect.height * scale) / 2 - svgRect.y * scale; updateTransform(); } document.getElementById('zoomIn').addEventListener('click', function() { scale += scaleStep; updateTransform(); }); document.getElementById('zoomOut').addEventListener('click', function() { scale = Math.max(scale - scaleStep, 0.1);
updateTransform(); }); document.getElementById('fitAll').addEventListener('click', function() { fitAll(); }); let isPanning = false; let startX, startY; svgCanvas.addEventListener('mousedown', function(e) { isPanning = true; startX = e.clientX; startY = e.clientY; }); window.addEventListener('mouseup', function() { isPanning = false; }); window.addEventListener('mousemove', function(e) { if (isPanning) { panX += (e.clientX - startX) * panSpeed; panY += (e.clientY - startY) * panSpeed; startX = e.clientX; startY = e.clientY; updateTransform(); } }); svg.addEventListener('wheel', function(e) { e.preventDefault(); const rect = svg.parentNode.getBoundingClientRect(); const diagramLocationX = (e.clientX - rect.left - panX) / scale; const diagramLocationY = (e.clientY - rect.top - panY) / scale; scale = scale - (e.deltaY / Math.abs(e.deltaY)) * scaleStep; scale = Math.max(Math.min(scale, 10), 0.1); const areaWidth = (rect.width / scale); const areaHeight = (rect.height / scale);
panX = e.clientX - rect.left - diagramLocationX * scale; panY = e.clientY - rect.top - diagramLocationY * scale; updateTransform(); }); window.addEventListener('load', function() { fitAll(); }); });

    </script>
